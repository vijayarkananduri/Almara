name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_direct_apk:
        description: 'Publish unsigned CI APKs as a direct GitHub Release download (not for stable releases)'
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Test and build Almara V1 APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Assemble unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Rename APKs
        run: cp app/build/outputs/apk/debug/app-debug.apk Almara-V1-debug.apk
      - name: Rename unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk Almara-V1-unsigned.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Almara-V1-apks
          path: |
            Almara-*-debug.apk
            Almara-*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Almara-*-debug.apk Almara-*-unsigned.apk --clobber
      - name: Create direct debug APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_direct_apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="almara-v1-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Almara-V1-unsigned.apk Almara-V1-debug.apk --title "Almara V1 APK ${GITHUB_RUN_NUMBER}" --notes "Unsigned Almara V1 build generated from ${GITHUB_SHA}." --target "$GITHUB_SHA"
